[package]
name = "solana-echo"
version = "0.1.0"
edition = "2021"
description = "A native Solana program that logs the instruction data it receives"
license = "MIT"
repository = "https://github.com/Ohad-G-5790/solana-echo"

[lib]
name = "solana_echo"
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
