[package]
name = "solana-vote-tally"
version = "0.1.0"
edition = "2021"
description = "A native Solana program that keeps an on-chain upvote and downvote tally"
license = "MIT"
repository = "https://github.com/Ohad-G-5790/solana-vote-tally"

[lib]
name = "solana_vote_tally"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
