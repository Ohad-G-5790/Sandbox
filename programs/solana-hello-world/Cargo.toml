[package]
name = "solana-hello-world"
version = "0.1.0"
edition = "2021"
description = "A minimal native Solana program that logs a greeting"
license = "MIT"
repository = "https://github.com/Ohad-G-5790/solana-hello-world"

[lib]
name = "solana_hello_world"
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
