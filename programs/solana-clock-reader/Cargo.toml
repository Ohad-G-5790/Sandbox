[package]
name = "solana-clock-reader"
version = "0.1.0"
edition = "2021"
description = "A native Solana program that reads and logs the Clock sysvar"
license = "MIT"
repository = "https://github.com/Ohad-G-5790/solana-clock-reader"

[lib]
name = "solana_clock_reader"
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
